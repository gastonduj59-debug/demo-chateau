<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Domaine, démonstration 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --chaux:#ECEAE4; --blanc:#FAF9F6; --lauze:#24272A; --meleze:#9E6235; --pierre:#716C64;
  --bg:var(--chaux); --ink:var(--lauze); --muted:var(--pierre); --card:rgba(250,249,246,.95); --filet:rgba(36,39,42,.14);
  --f:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif; --ease:cubic-bezier(.2,.7,.2,1);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1C1F22; --ink:#ECEAE4; --muted:#ABA69D; --card:rgba(37,41,45,.95); --filet:rgba(236,234,228,.16);} }
:root[data-theme="dark"]{ --bg:#1C1F22; --ink:#ECEAE4; --muted:#ABA69D; --card:rgba(37,41,45,.95); --filet:rgba(236,234,228,.16); }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--meleze);outline-offset:3px}
.top{flex:none;display:flex;align-items:center;gap:24px;height:68px;padding:0 clamp(16px,3vw,40px);background:var(--bg);border-bottom:1px solid var(--filet);z-index:20}
.brand{white-space:nowrap}
.brand b{font-stretch:125%;font-weight:300;font-size:22px;letter-spacing:.01em}
.brand span{margin-left:12px;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;font-size:15px;font-stretch:106%;padding:10px 13px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--meleze);font-weight:500}
.daynight{display:flex;border:1px solid var(--filet);flex:none}
.daynight button{padding:8px 12px;font-size:14px;color:var(--muted)}
.daynight button.on{background:var(--ink);color:var(--bg)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#cfd8df;user-select:none;-webkit-user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fade{position:absolute;inset:0;background:#e9e7e2;opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:15}
#fade.on{opacity:1}
#tags{position:absolute;inset:0;pointer-events:none;z-index:4;transition:opacity .4s}
.walking #tags{opacity:0}
.tag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;transform:translate3d(-9999px,0,0);opacity:0;transition:opacity .35s}
.tag.vis{opacity:1}
.tag i{width:12px;height:12px;border-radius:50%;background:var(--lauze);box-shadow:0 0 0 3px rgba(250,249,246,.95);flex:none}
.tag span{font-size:13px;font-weight:500;font-stretch:106%;color:var(--lauze);background:rgba(250,249,246,.95);padding:4px 8px;border-radius:2px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.tag:hover span{background:var(--lauze);color:#ECEAE4}
.desc{position:absolute;z-index:6;left:clamp(14px,2.4vw,32px);top:20px;max-width:360px;background:var(--card);padding:16px 18px 14px;box-shadow:0 10px 30px rgba(0,0,0,.1);transition:opacity .4s}
.desc h1{margin:0 0 6px;font-stretch:115%;font-weight:300;font-size:26px;line-height:1.05}
.desc p{margin:0;font-size:14.5px;line-height:1.5;color:var(--muted)}
.demo{display:block;margin-top:10px;font-size:12.5px;color:var(--muted);opacity:.85}
.ctrl{position:absolute;z-index:6;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;background:var(--card);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.ctrl:empty{display:none}
.ctrl button{min-height:42px;padding:0 14px;font-size:14px;white-space:nowrap;border:1px solid transparent}
.ctrl button:hover{background:rgba(127,127,127,.1)}
.ctrl button.on{border-color:var(--ink);font-weight:500}
.ctrl button.ink{background:var(--lauze);color:#ECEAE4}
.ctrl .lab{font-size:13.5px;color:var(--muted);padding:0 8px;align-self:center;white-space:nowrap}
/* Personnage */
.dock{position:absolute;z-index:7;right:clamp(14px,2.4vw,32px);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;background:var(--card);padding:8px 14px 8px 8px;box-shadow:0 10px 30px rgba(0,0,0,.12);transition:opacity .4s}
.walking .dock{opacity:0;pointer-events:none}
.peg{width:52px;height:52px;border-radius:50%;background:var(--meleze);display:grid;place-items:center;cursor:grab;touch-action:none;flex:none;box-shadow:0 4px 14px rgba(158,98,53,.4)}
.peg:active{cursor:grabbing}
.peg svg{width:30px;height:30px}
.dock p{margin:0;font-size:13.5px;line-height:1.35;max-width:150px;color:var(--ink)}
.dock p b{display:block;font-weight:600}
#ghost{position:fixed;z-index:50;width:46px;height:46px;margin:-46px 0 0 -23px;pointer-events:none;display:none}
#ghost svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.walkbar{position:absolute;z-index:7;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;gap:6px;background:var(--card);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-width:calc(100% - 24px);overflow-x:auto}
.walking .walkbar{display:flex}
.walking .ctrl{display:none}
.walkbar button{min-height:42px;padding:0 14px;font-size:14px;white-space:nowrap;border:1px solid transparent}
.walkbar button.on{border-color:var(--ink);font-weight:500}
.walkbar button.ink{background:var(--lauze);color:#ECEAE4}
.walkbar button[disabled]{opacity:.35;cursor:default}
.where{position:absolute;z-index:6;left:clamp(14px,2.4vw,32px);bottom:calc(84px + env(safe-area-inset-bottom,0px));color:#fff;text-shadow:0 1px 16px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .5s}
.walking .where{opacity:1}
.where small{display:block;font-size:14px;opacity:.9}
.where b{display:block;font-stretch:118%;font-weight:280;font-size:clamp(30px,4.4vw,56px);line-height:1;margin-top:4px}
.hintw{position:absolute;z-index:6;right:clamp(14px,2.4vw,32px);top:20px;max-width:260px;font-size:13.5px;line-height:1.45;background:var(--card);padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.1);display:none}
.walking .hintw{display:block}
.walking .desc{opacity:0;pointer-events:none}
.card{position:absolute;z-index:8;right:clamp(14px,2.4vw,32px);top:20px;width:min(320px,calc(100% - 28px));background:var(--blanc);color:var(--lauze);box-shadow:0 18px 50px rgba(0,0,0,.18);padding:18px 18px 16px;transform:translateX(24px);opacity:0;pointer-events:none;transition:transform .5s var(--ease),opacity .5s var(--ease)}
.card.open{transform:none;opacity:1;pointer-events:auto}
.card .l{margin:0;font-size:13px;color:var(--pierre)}
.card h2{margin:4px 0 8px;font-stretch:112%;font-weight:300;font-size:26px;line-height:1.08}
.card p.d{margin:0 0 14px;font-size:14.5px;line-height:1.5}
.card .r{display:flex;gap:8px}
.card .r button{min-height:42px;padding:0 14px;font-size:14px;border:1px solid rgba(36,39,42,.3)}
.card .r button.ink{background:var(--lauze);color:#ECEAE4;border-color:var(--lauze);flex:1}
.card .x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;font-size:20px;display:grid;place-items:center}
@media (max-width:760px){
  .top{height:auto;flex-wrap:wrap;gap:0;padding:10px 0 0}
  .brand{padding:0 16px 6px;flex:1}
  .brand span{display:none}
  .daynight{margin-right:12px;margin-bottom:6px}
  .tabs{width:100%;margin:0;padding:0 8px;order:3}
  .tabs button{padding:10px 9px;font-size:14px}
  .desc{left:10px;right:10px;top:10px;max-width:none;padding:12px 14px}
  .desc h1{font-size:21px}.desc p{font-size:13px}
  .ctrl{left:10px;right:auto;transform:none;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 20px)}
  .dock{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .dock p{max-width:none}
  .walkbar{left:10px;right:10px;transform:none;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .where{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .hintw{left:10px;right:10px;top:10px;max-width:none}
  .card{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:10px;right:10px;width:auto}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition-duration:.01ms!important} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Le Domaine</b><span>Démonstration 3D</span></div>
  <nav class="tabs" id="tabs" aria-label="Vues">
    <button data-m="domaine">Le domaine</button>
    <button data-m="jardins">Jardins et piscine</button>
    <button data-m="niveaux">Les niveaux</button>
    <button data-m="eclate">Éclaté</button>
  </nav>
  <div class="daynight" role="group" aria-label="Moment de la journée"><button data-t="jour" class="on">Jour</button><button data-t="soir">Soir</button></div>
</header>
<main class="stage" id="stage">
  <canvas id="c" aria-label="Maquette 3D d'un château-hôtel imaginaire"></canvas>
  <div id="tags"></div>
  <div class="desc" id="desc"><h1></h1><p></p><span class="demo">Lieu imaginaire, créé pour la démonstration.</span></div>
  <div class="ctrl" id="ctrl"></div>
  <div class="dock" id="dock">
    <div class="peg" id="peg" role="button" tabindex="0" aria-label="Glisser le personnage sur la maquette pour visiter à pied">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="12" cy="4.6" r="2.6"/><path d="M8.6 8.4h6.8c.9 0 1.6.7 1.6 1.6v5.2h-1.8V22h-2.4v-6.2h-1.6V22H8.8v-6.8H7V10c0-.9.7-1.6 1.6-1.6z"/></svg>
    </div>
    <p><b>Visite à pied</b>Glissez le personnage sur la maquette</p>
  </div>
  <div class="where" id="where"><small id="whereL"></small><b id="whereN"></b></div>
  <div class="hintw" id="hintw">Faites glisser pour regarder autour de vous. Touchez le sol pour avancer jusqu'à ce point, ou utilisez les flèches du clavier.</div>
  <div class="walkbar" id="walkbar"></div>
  <aside class="card" id="card"></aside>
  <div id="fade"></div>
</main>
<div id="ghost"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11.5" fill="#9E6235"/><g fill="#fff" transform="translate(4.5 3.2) scale(.62)"><circle cx="12" cy="4.6" r="2.6"/><path d="M8.6 8.4h6.8c.9 0 1.6.7 1.6 1.6v5.2h-1.8V22h-2.4v-6.2h-1.6V22H8.8v-6.8H7V10c0-.9.7-1.6 1.6-1.6z"/></g></svg></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const MOBILE=matchMedia("(max-width: 760px)").matches;
const TOUCH=matchMedia("(hover: none)").matches;
const T=THREE, stage=$("#stage"), canvas=$("#c");
if(TOUCH) $("#hintw").textContent="Glissez pour regarder autour de vous. Touchez le sol pour avancer jusqu'à ce point.";

/* ================= Rendu ================= */
const renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,MOBILE?1.35:1.75));
renderer.outputEncoding=T.sRGBEncoding; renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=0.62;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap; renderer.shadowMap.autoUpdate=false; let shadowDirty=true;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(34,1,0.08,2000);
const controls=new T.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxPolarAngle=1.42; controls.minDistance=6; controls.maxDistance=160; controls.rotateSpeed=0.6;
controls.enableZoom=TOUCH; if(!TOUCH){ canvas.addEventListener("pointerdown",()=>{ controls.enableZoom=true; }); stage.addEventListener("pointerleave",()=>{ controls.enableZoom=false; }); }
const col=h=>new T.Color(h).convertSRGBToLinear();
const rnd=a=>{ let s=a; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; };

/* Ciel */
const sky=new T.Sky(); sky.scale.setScalar(1800); scene.add(sky);
const su=sky.material.uniforms; su.turbidity.value=4; su.rayleigh.value=1.2; su.mieCoefficient.value=0.004; su.mieDirectionalG.value=0.8;
const sunDir=new T.Vector3();
const pmrem=new T.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new T.RoomEnvironment(),0.04).texture;
scene.fog=new T.Fog(col("#C9D2D8"),140,520);

/* ================= Textures ================= */
function ctex(w,h,draw,lin){ const c=document.createElement("canvas"); c.width=w; c.height=h; draw(c.getContext("2d"),w,h); const t=new T.CanvasTexture(c); if(!lin) t.encoding=T.sRGBEncoding; t.wrapS=t.wrapT=T.RepeatWrapping; t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); return t; }
const TX={
  pierre: ctex(512,512,(g,w,h)=>{ const r=rnd(7); g.fillStyle="#E2D9C8"; g.fillRect(0,0,w,h); const rows=8, rh=h/rows;
    for(let y=0;y<rows;y++){ let x=-(y%2)*64; while(x<w){ const bw=96+r()*60; const v=214+r()*20|0; g.fillStyle="rgb("+v+","+(v-8)+","+(v-24)+")"; g.fillRect(x+2,y*rh+2,bw-4,rh-4);
        for(let k=0;k<40;k++){ g.fillStyle="rgba(120,100,70,"+(r()*0.06)+")"; g.fillRect(x+r()*bw,y*rh+r()*rh,2+r()*3,2); } x+=bw; } }
    g.strokeStyle="rgba(150,135,110,.35)"; g.lineWidth=2; }),
  ardoise: ctex(256,256,(g,w,h)=>{ const r=rnd(13); g.fillStyle="#3E4349"; g.fillRect(0,0,w,h); const rows=16, rh=h/rows; for(let y=0;y<rows;y++){ let x=-(y%2)*8; while(x<w){ const sw=14+r()*6; const v=62+r()*22|0; g.fillStyle="rgb("+(v-4)+","+v+","+(v+8)+")"; g.fillRect(x+1,y*rh+1,sw-1.5,rh-1.5); x+=sw; } } }),
  herbe: ctex(512,512,(g,w,h)=>{ const r=rnd(21); g.fillStyle="#6E8B4E"; g.fillRect(0,0,w,h); for(let i=0;i<26000;i++){ const v=r(); g.fillStyle=v<.5?"rgba(70,95,45,"+(r()*0.35)+")":"rgba(150,175,100,"+(r()*0.25)+")"; g.fillRect(r()*w,r()*h,1.5,2+r()*3); } }),
  gravier: ctex(1024,1024,(g,w,h)=>{ const r=rnd(31); g.fillStyle="#C4BAA6"; g.fillRect(0,0,w,h);
    const tones=[[205,196,178],[184,176,160],[168,162,152],[214,206,190],[190,172,146],[150,146,140]];
    for(let i=0;i<22000;i++){ const x=r()*w, y=r()*h, rx=1.4+r()*3.4, ry=rx*(0.6+r()*0.4), a=r()*Math.PI, c=tones[r()*tones.length|0], d=(r()-0.5)*18;
      g.fillStyle="rgba(70,62,50,.22)"; g.beginPath(); g.ellipse(x+0.8,y+1.1,rx,ry,a,0,7); g.fill();
      g.fillStyle="rgb("+(c[0]+d|0)+","+(c[1]+d|0)+","+(c[2]+d|0)+")"; g.beginPath(); g.ellipse(x,y,rx,ry,a,0,7); g.fill();
      if(r()<0.5){ g.fillStyle="rgba(255,250,240,.16)"; g.beginPath(); g.ellipse(x-rx*0.3,y-ry*0.3,rx*0.45,ry*0.4,a,0,7); g.fill(); } } }),
  dalle: ctex(512,512,(g,w,h)=>{ const r=rnd(41); g.fillStyle="#CFC6B6"; g.fillRect(0,0,w,h); const n=4, s=w/n; for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const v=200+r()*26|0; g.fillStyle="rgb("+v+","+(v-6)+","+(v-18)+")"; g.fillRect(i*s+2,j*s+2,s-4,s-4); for(let k=0;k<160;k++){ g.fillStyle="rgba(110,95,70,"+(r()*0.05)+")"; g.fillRect(i*s+r()*s,j*s+r()*s,3,3);} } }),
  parquet: ctex(512,512,(g,w,h)=>{ const r=rnd(51); g.fillStyle="#B98C5E"; g.fillRect(0,0,w,h); const n=10, s=h/n; for(let i=0;i<n;i++){ let x=-(i%2)*80; while(x<w){ const L=120+r()*90; const v=r(); g.fillStyle="rgba("+(v<.5?"90,55,25":"230,190,140")+","+(0.08+r()*0.12)+")"; g.fillRect(x,i*s,L,s); g.fillStyle="rgba(60,35,15,.35)"; g.fillRect(x,i*s,1.5,s); x+=L; } g.fillStyle="rgba(60,35,15,.35)"; g.fillRect(0,i*s,w,1.2); } }),
  marbre: ctex(512,512,(g,w,h)=>{ const r=rnd(61); g.fillStyle="#EEEAE2"; g.fillRect(0,0,w,h); const n=4,s=w/n; for(let i=0;i<n;i++) for(let j=0;j<n;j++){ g.fillStyle=(i+j)%2?"#E6E1D7":"#F2EFE9"; g.fillRect(i*s,j*s,s,s);} for(let k=0;k<30;k++){ g.strokeStyle="rgba(150,140,125,"+(0.08+r()*0.1)+")"; g.lineWidth=0.6+r(); g.beginPath(); let x=r()*w,y=r()*h; g.moveTo(x,y); for(let q=0;q<6;q++){ x+=r()*80-40; y+=r()*80-40; g.lineTo(x,y);} g.stroke(); } }),
  haie: ctex(256,256,(g,w,h)=>{ const r=rnd(71); g.fillStyle="#2F4A2A"; g.fillRect(0,0,w,h); for(let i=0;i<9000;i++){ const v=r(); g.fillStyle=v<.5?"rgba(20,40,20,.5)":"rgba(80,115,60,"+(r()*0.5)+")"; g.beginPath(); g.arc(r()*w,r()*h,1+r()*2.2,0,7); g.fill(); } }),
  carreau: ctex(256,256,(g,w,h)=>{ g.fillStyle="#8FC6CF"; g.fillRect(0,0,w,h); g.strokeStyle="rgba(255,255,255,.55)"; g.lineWidth=2; for(let i=0;i<=8;i++){ g.beginPath(); g.moveTo(i*32,0); g.lineTo(i*32,h); g.stroke(); g.beginPath(); g.moveTo(0,i*32); g.lineTo(w,i*32); g.stroke(); } }),
  eauN: ctex(256,256,(g,w,h)=>{ const r=rnd(81); const img=g.createImageData(w,h); const hs=[]; for(let i=0;i<w*h;i++) hs.push(0);
    for(let o=0;o<6;o++){ const fx=1+r()*4|0, fy=1+r()*4|0, ph=r()*6.28; for(let y=0;y<h;y++) for(let x=0;x<w;x++) hs[y*w+x]+=Math.sin((x/w*fx+y/h*fy)*6.283+ph)/(o+1); }
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x; const dx=hs[y*w+((x+1)%w)]-hs[i], dy=hs[((y+1)%h)*w+x]-hs[i]; const k=i*4; img.data[k]=128+dx*90; img.data[k+1]=128+dy*90; img.data[k+2]=255; img.data[k+3]=255; }
    g.putImageData(img,0,0); },true),
};
function tm(tex,rx,ry,opts){ const t=tex.clone(); t.needsUpdate=true; t.repeat.set(rx,ry); return new T.MeshStandardMaterial(Object.assign({map:t,roughness:.9},opts||{})); }

/* ================= Matériaux ================= */
const M={
  facade:new T.MeshStandardMaterial({map:TX.pierre,roughness:.88}),
  pierreLisse:new T.MeshStandardMaterial({color:col("#EAE3D6"),roughness:.8}),

  if(inside(p)){ [["RDC",0],["1er",1]].forEach(([l,k])=>btn(wb,l,walk.lvl===k,()=>{ if(walk.lvl===k) return; fade(()=>{ walk.lvl=k; walk.foot=LV[k]; camera.position.y=LV[k]+walk.eye; walk.target=null; updateWhere(); }); })); }
  btn(wb,"Quitter la visite",false,()=>exitWalk(false),"ink"); }
// regarder et avancer
(function(){ let down=null;
  canvas.addEventListener("pointerdown",e=>{ if(!state.walking) return; down={x:e.clientX,y:e.clientY,yaw:walk.yaw,pitch:walk.pitch,moved:false}; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove",e=>{ if(!down||!state.walking) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; if(Math.abs(dx)+Math.abs(dy)>5) down.moved=true; const s=TOUCH?0.006:0.0038; walk.yaw=down.yaw-dx*s; walk.pitch=Math.max(-1.1,Math.min(1.0,down.pitch+dy*s)); applyLook(); });
  canvas.addEventListener("pointerup",e=>{ if(!state.walking||!down) return; const moved=down.moved; down=null; if(moved) return; const f=pickFloor(e.clientX,e.clientY); if(!f) return; walk.target=new T.Vector3(f.p.x,0,f.p.z); marker.visible=true; marker.position.set(f.shown.x,f.shown.y+0.03,f.shown.z); });
  canvas.addEventListener("pointercancel",()=>{ down=null; });
  window.addEventListener("keydown",e=>{ if(!state.walking) return; walk.keys[e.key.toLowerCase()]=true; if(["arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase())) e.preventDefault(); });
  window.addEventListener("keyup",e=>{ walk.keys[e.key.toLowerCase()]=false; });
})();
const tmpV=new T.Vector3();
function floorAt(x,z,foot){
  if(x>-5.3&&x<-1.6&&z>-6.4&&z<-1.0){ const ym=(LV[0]+LV[1])/2; if(z<=-4.4) return ym; if(x<-3.45) return LV[0]+((-1.0-z)/3.4)*(ym-LV[0]); return ym+((z+4.4)/3.4)*(LV[1]-ym); }
  if(Math.abs(x)<BX&&Math.abs(z)<BZ){ let best=LV[0]; for(const l of LV){ if(Math.abs(l-foot)<Math.abs(best-foot)) best=l; } return best; }
  if(z>=BZ&&z<15.2&&Math.abs(x)<21) return LV[0];
  if(Math.abs(x)<4&&z>=15.2&&z<16.8) return LV[0]*(1-(z-15.2)/1.6);
  if(Math.abs(x)<3&&z>-8.4&&z<=-BZ) return LV[0]*Math.max(0,(z+8.4)/1.4);
  if(x>27&&x<59&&z>12&&z<37) return 0.08;
  return 0; }
function hits(x,z,foot){ const r=(x>-5.4&&x<-1.5&&z>-6.45&&z<-0.9)?0.25:0.3, a=foot+0.2, b=foot+1.75;
  for(let i=0;i<colliders.length;i++){ const c=colliders[i]; if(c.y1<a||c.y0>b) continue; if(x>c.x0-r&&x<c.x1+r&&z>c.z0-r&&z<c.z1+r) return true; }
  for(let i=0;i<circles.length;i++){ const c=circles[i]; if(c.y1<a||c.y0>b) continue; const dx=x-c.x, dz=z-c.z, R=c.r+r; if(dx*dx+dz*dz<R*R) return true; }
  return false; }
function tryMove(dx,dz){ const p=camera.position, f=walk.foot; if(hits(p.x,p.z,f)){ p.x+=dx; p.z+=dz; return true; }
  const nx=p.x+dx, nz=p.z+dz; if(!hits(nx,nz,floorAt(nx,nz,f))){ p.x=nx; p.z=nz; return true; }
  if(Math.abs(dx)>1e-5&&!hits(nx,p.z,floorAt(nx,p.z,f))){ p.x=nx; return true; } if(Math.abs(dz)>1e-5&&!hits(p.x,nz,floorAt(p.x,nz,f))){ p.z=nz; return true; } return false; }
function stepWalk(){ if(!state.walking) return; const K=walk.keys; const fwd=new T.Vector3(Math.sin(walk.yaw),0,Math.cos(walk.yaw));
  if(K["arrowleft"]||K["q"]||K["a"]) walk.yaw+=DT*1.6; if(K["arrowright"]||K["d"]) walk.yaw-=DT*1.6;
  let dir=0; if(K["arrowup"]||K["z"]||K["w"]) dir=1; if(K["arrowdown"]||K["s"]) dir=-1;
  const inB=Math.abs(camera.position.x)<BX&&Math.abs(camera.position.z)<BZ; const speed=inB?2.0:4.0;
  if(dir){ walk.target=null; marker.visible=false; tryMove(fwd.x*dir*speed*DT,fwd.z*dir*speed*DT); }
  else if(walk.target){ tmpV.copy(walk.target).sub(camera.position); tmpV.y=0; const d=tmpV.length(); if(d<0.08){ walk.target=null; marker.visible=false; } else { tmpV.normalize(); const st=Math.min(d,speed*DT); if(!tryMove(tmpV.x*st,tmpV.z*st)){ walk.target=null; marker.visible=false; } } }
  const tgt=floorAt(camera.position.x,camera.position.z,walk.foot); walk.foot+=(tgt-walk.foot)*Math.min(1,DT*10); camera.position.y=walk.foot+walk.eye;
  if(Math.abs(camera.position.x)<BX&&Math.abs(camera.position.z)<BZ){ let bi=0; LV.forEach((l,i)=>{ if(Math.abs(l-walk.foot)<Math.abs(LV[bi]-walk.foot)) bi=i; }); walk.lvl=bi; } else walk.lvl=-1;
  applyLook(); if(Math.random()<0.08) updateWhere(); }

function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener("resize",resize); resize();
let last=performance.now(), DT=0.016;
setTime(false); setMode("domaine");
{ const v=VIEW.domaine(); const t=v.t; camera.position.set(...scl([v.p[0]-20,v.p[1]+14,v.p[2]+16],t)); controls.target.set(...t); flyTo(scl(v.p,t),t,3200); }
function loop(now){ requestAnimationFrame(loop); { const nn=state.walking?0.06:0.6, ff=state.walking?900:2000; if(camera.near!==nn){ camera.near=nn; camera.far=ff; camera.updateProjectionMatrix(); } } DT=Math.min(0.1,Math.max(0,(now-last)/1000)); last=now;
  stepTw(now); applyOffsets(); stepWalk();
  M.eau.normalMap.offset.x=(now*0.00002)%1; M.eau.normalMap.offset.y=(now*0.000013)%1;
  if(!state.walking&&!tw) controls.update();
  if(shadowDirty){ renderer.shadowMap.needsUpdate=true; shadowDirty=false; }
  renderer.render(scene,camera); updateTags(); }
requestAnimationFrame(loop);
window.__d={scene,T,setMode,setTime,enterWalk:(x,y,z,l)=>enterWalk(new T.Vector3(x,y,z),l),state,walk,sim:(n,dt,keys)=>{ Object.assign(walk.keys,keys||{}); for(let i=0;i<n;i++){ DT=dt; stepWalk(); } walk.keys={}; const p=camera.position; return [+p.x.toFixed(2),+p.y.toFixed(2),+p.z.toFixed(2),+walk.foot.toFixed(2),walk.lvl]; }};
})();
